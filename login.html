<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>Login</h1>

            <form id="loginForm">

                <label for="loginUsername">
                    Username / Email
                </label>

                <input
                    type="text"
                    id="loginUsername"
                    placeholder="Enter username or email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

            <p class="link-text">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
